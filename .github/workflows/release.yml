name: Release Kraken API

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  packages: write

jobs:
  release:
    environment: Prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Calculate version
        run: |
          BASE_VERSION=$(cat version.txt | tr -d '[:space:]')
          MAJOR_MINOR=$(echo $BASE_VERSION | cut -d. -f1,2)

          if git rev-parse "refs/tags/${BASE_VERSION}" >/dev/null 2>&1; then
            LAST_TAG=$(git tag -l "${MAJOR_MINOR}.*" --sort=-version:refname | head -n 1)
            LAST_PATCH=$(echo $LAST_TAG | awk -F. '{print $NF}')
            PATCH=$((LAST_PATCH + 1))
            VERSION="${MAJOR_MINOR}.${PATCH}"
          else
            VERSION="${BASE_VERSION}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Calculated version: $VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/modules-*/files-*/
            caches/jars-*/
            caches/transforms-*/

      - name: Build project
        run: |
          echo "Building project with version $VERSION"
          chmod +x ./gradlew
          ./gradlew clean build shadowJar

      - name: Collect commit messages since last tag
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s")
          fi
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Cleanup Old Package Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: com.github.kraken.kraken-api
          package-type: maven
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
        continue-on-error: true

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: ${{ env.COMMITS }}

      - name: Install MinIO client
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Configure MinIO client
        run: |
          mc alias set s3 ${{ secrets.MINIO_URL }} ${{ secrets.MINIO_ACCESS_KEY }} ${{ secrets.MINIO_SECRET_KEY }}

      - name: Upload JAR to MinIO
        run: |
          PLAIN_JAR=$(find build/libs -name "kraken-api-${VERSION}.jar" ! -name "*-all.jar")

          echo "Uploading shaded jar: $PLAIN_JAR"
          mc cp "$PLAIN_JAR" s3/kraken-bootstrap-static/api/kraken-api-${VERSION}.jar

      - name: Sync Packets
        run: |
          echo "Uploading Hooks file to MinIO..."
          mc cp src/main/resources/hooks.json s3/kraken-bootstrap-static/hooks.json

      - name: Publish to GitHub Packages
        run: |
          echo "Publishing version $VERSION to GitHub Packages"
          ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}