name: Build & Test Kraken API

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/modules-*/files-*/
            caches/jars-*/
            caches/transforms-*/

      - name: Build & Test
        run: |
          chmod +x ./gradlew
          ./gradlew clean build
