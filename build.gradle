plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

// Project version is set via the VERSION environment
// variable in the Github Actions workflow and should not be changed here.
def projectVersion = System.getenv("VERSION") ?: '1.0.0'
def runeLiteVersion = '1.13.1' // latest.release

version = projectVersion
project.version = projectVersion

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.runelite.net'
    }
    maven { url 'https://jitpack.io' }
    mavenLocal()
}

tasks.register('runelite', JavaExec) {
    group = 'application'
    description = 'Runs the API Test with assertions enabled'
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('PluginRunnerTest')
    jvmArgs '-ea'
    // PluginRunnerTest reads args[0] as the plugin class to load as a builtin and forwards the
    // rest to RuneLite, so these must be separate arguments with the plugin first. Passing them
    // as one string made Class.forName fail and the task exit before the client ever started.
    args 'plugins.api.ApiTestPlugin', '--developer-mode'
}


dependencies {
    // NOTE: These dependencies are REQUIRED for the Kraken API to run. There are specifically omitted from Kraken's API's Jar file for 2
    // key reasons:
    // 1. RuneLite provides guice, guava, gson in its runtime dependencies already so packaging them with Kraken can introduce different version and create dependency issues and introduces bloat
    // 2. Its a design choice to let users inject dependencies into RuneLite's classloader how the they sees fit. Kraken's API makes a choice to not impose how users choose to load required dependencies
    compileOnly("org.slf4j:slf4j-api:1.7.25")
    compileOnly("org.slf4j:slf4j-simple:1.7.25")
    compileOnly("com.google.code.gson:gson:2.8.5")
    compileOnly("com.google.guava:guava:31.1-jre")
    compileOnly("com.google.inject:guice:4.2.2")
    compileOnly("net.runelite:client:${runeLiteVersion}")

    implementation 'com.github.Kraken-Plugins:shortest-path:11d64616eb'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.13.1'
    testImplementation "net.runelite:client:$runeLiteVersion"
    testImplementation "net.runelite:jshell:$runeLiteVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.mockito:mockito-core:4.11.0'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.0'
}

test {
    useJUnitPlatform()
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
    // Generator for the llms.txt files. It is not part of the published jar.
    llms
}

dependencies {
    llmsCompileOnly 'org.projectlombok:lombok:1.18.30'
    llmsAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

// Writes llms.txt, llms-full.txt and llms-api.txt to build/llms (or -PllmsOutput=<dir>) for the current VERSION.
tasks.register('generateLlmsTxt', JavaExec) {
    group = 'documentation'
    description = 'Generates llms.txt, llms-full.txt and llms-api.txt from docs/ and the public API'
    def outputDirectory = project.findProperty('llmsOutput') ?: layout.buildDirectory.dir('llms').get().asFile.path

    inputs.dir('src/main/java')
    inputs.dir('docs')
    inputs.property('version', projectVersion)
    outputs.files(['llms.txt', 'llms-full.txt', 'llms-api.txt'].collect { new File(outputDirectory, it) })

    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.llms.runtimeClasspath
    mainClass = 'com.kraken.llms.LlmsGenerator'
    args '--source', file('src/main/java').path,
            '--docs', file('docs').path,
            '--classpath', sourceSets.main.compileClasspath.asPath,
            '--output', file(outputDirectory).path,
            '--version', projectVersion
}


java {
    withSourcesJar()
    withJavadocJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    archiveBaseName = 'kraken-api'
    archiveVersion = projectVersion
    archiveClassifier = 'unshaded'
}

// The RuneLite version and game revision hooks.json was mapped for, both written by kraken-updater. They go in the
// jar manifest so build tooling can warn when a plugin is compiled or run against hooks for a different RuneLite.
def hooksTarget = providers.fileContents(layout.projectDirectory.file('src/main/resources/hooks.json')).asText.map { text ->
    def hooks = new groovy.json.JsonSlurper().parseText(text)
    [runeliteVersion: hooks.runeliteVersion, revision: hooks.revision]
}

shadowJar {
    archiveBaseName = 'kraken-api'
    archiveVersion = projectVersion
    archiveClassifier = '' // Purposefully leave this as none the only jar produced is the shaded jar.

    def target = hooksTarget.get()
    if (target.runeliteVersion == null || target.revision == null) {
        logger.warn("hooks.json does not record its RuneLite version and revision; regenerate it with kraken-updater " +
                "so the jar manifest can carry Kraken-RuneLite-Version and Kraken-Game-Revision.")
    }
    manifest {
        attributes(['Kraken-Api-Version'     : projectVersion,
                    'Kraken-RuneLite-Version': target.runeliteVersion,
                    'Kraken-Game-Revision'   : target.revision].findAll { it.value != null })
    }

    exclude 'kraken.png'

    dependencies {
        exclude(dependency('net.runelite:client:.*'))
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            project.shadow.component(it)
            groupId = 'com.github.kraken'
            artifactId = 'kraken-api'
            version = project.version

            pom {
                name = 'Kraken API'
                description = 'Kraken API Automation Library for Old School RuneScape'
                url = 'https://github.com/Kraken-Plugins/kraken-api'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'cbartram'
                        name = 'cbartram'
                        email = 'runewraith.business@gmail.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/Kraken-Plugins/kraken-api.git'
                    developerConnection = 'scm:git:ssh://github.com/Kraken-Plugins/kraken-api.git'
                    url = 'https://github.com/Kraken-Plugins/kraken-api'
                }
            }
        }
    }

    repositories {
        maven {
            name = "Staging"
            url = layout.buildDirectory.dir("maven-repo")
        }
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Kraken-Plugins/kraken-api")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

build.dependsOn shadowJar
